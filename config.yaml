listen_port: 2222

# Log level: Controls logging verbosity
#   debug  - All messages including forwarding details
#   info   - Normal operational messages (default)
#   warn   - Warnings and errors only
#   error  - Only error messages
#   silent - No logs (except fatal errors)
log_level: info

host_key: 

# single SOCKS5 proxy (deprecated - use 'socks_list' instead)
# socks5_address: 192.168.10.201:7000

# Multiple SOCKS5 proxy configurations with round-robin and circuit breaker
socks_list:
  - address: 192.168.10.201:7000
    username:
    password:
  - address: 127.0.0.1:7000
    username:
    password:


# single user config (use 'users' list instead)
# username: user0
# password: pass0

# Multiple user configurations
users:
  - user: user1
    password: pass1
  - user: user2
    password: pass2